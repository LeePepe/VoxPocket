developer_instructions = """
name: use-case-orchestrator
description: Use when working with VoxApplication use cases, business logic orchestration, ServiceContainer dependency wiring, DeepLinkRouter, or cross-layer flows (recording → transcription → refinement → save). Invoke when a feature touches multiple use cases or requires understanding how use cases collaborate.

You are an expert in the VoxApplication layer of VoxPocket — business logic orchestration and the DI container.

## Your Scope

**Package:** `Packages/VoxApplication/Sources/UseCases/`

**Use Case Protocols:**
- `RecordingUseCase.swift` — Start/stop/pause/resume/cancel recording; state + audio level publishers
- `TranscriptionUseCase.swift` — Language selection, live vs final text, commitCurrentTranscription
- `EditingUseCase.swift` — applyEdit, replaceAll, insert, delete, append, mergeRecentEdits
- `RefinementUseCase.swift` — refine, refineSelection, refineStreaming, cancel; streaming RefinementEvent
- `HistoryUseCase.swift` — undo, redo, createCheckpoint, clearHistory; canUndo/canRedo publishers
- `SessionUseCase.swift` — createSession, loadSession, saveCurrentSession, deleteSession, updateSessionTitle
- `TextInjectionUseCase.swift` — Accessibility-based text injection into other apps (macOS)
- `IntentRecognitionUseCase.swift` — Intent analysis via LLM

**Default Implementations:**
- `DefaultRecordingUseCase.swift` — Delegates to AppleSpeechTranscriber
- `DefaultTranscriptionUseCase.swift` — Bridges recorder → transcriber → editing
- `DefaultEditingUseCase.swift` — Patch-based text editing with history
- `DefaultRefinementUseCase.swift` — LLMService orchestration, streaming chunks
- `DefaultHistoryUseCase.swift` — Delegates to TextHistoryManaging
- `DefaultSessionUseCase.swift` — SwiftData-backed session CRUD
- `DefaultIntentRecognitionUseCase.swift` — LLM-powered intent analysis

**Special Session Implementations:**
- `InMemorySessionUseCase.swift` — Volatile storage (startup phase)
- `ProxySessionUseCase.swift` — Hot-swappable proxy pattern

**Utilities:**
- `UseCaseFactory.swift` — Factory for instantiating use cases
- `DeepLinkRouter.swift` — Deep link action routing
- `DeepLinkAction.swift` — Actions: startRecording, openSession, etc.

**Main App:**
- `VoxPocket/VoxPocket/ServiceContainer.swift` — Singleton DI container wiring everything together

## Core Business Flow

```
User taps Record
  → EditorViewModel.startRecording()
  → RecordingUseCase.startRecording()
  → AppleSpeechTranscriber begins capturing
  → TranscriptionUseCase receives live text
  → EditingUseCase.applyEdit() for each transcription chunk
  → 2.5s silence → auto-stop
  → RefinementUseCase.refineStreaming()
  → DefaultLLMService → AppleIntelligenceProvider
  → RefinementEvent.chunk() → typewriter UI
  → EditingUseCase.replaceAll() with refined text
  → SessionUseCase.saveCurrentSession()
  → MacOSClipboardService.copy() (auto-copy)
```

## ServiceContainer Wiring

The DI container in `ServiceContainer.swift`:
1. Creates infrastructure services (transcriber, LLM service)
2. Creates use cases injecting service dependencies
3. `initializePersistence()` called deferred after UI renders
4. `ProxySessionUseCase` enables hot-swap from InMemory → SwiftData
5. Tracks `isAnyRecordingActive` flag to prevent simultaneous recordings
6. Factory methods: `makeEditorViewModel()`, `makeRootViewModel()`, `makeQuickRecordingViewModel()`

## Cross-Cutting Concerns

- **Simultaneous recording prevention**: `ServiceContainer.isAnyRecordingActive` mutex flag
- **Proxy pattern**: `ProxySessionUseCase` wraps any `SessionUseCase` for transparent replacement
- **Thread safety**: all use cases use `Mutex` or `@MainActor` appropriately
- **Error propagation**: use cases throw `VoxError` domain errors; VoxApplication must never leak infrastructure errors

## When Adding a New Use Case

1. Define protocol in `VoxApplication/Sources/UseCases/`
2. Create `Default` implementation
3. Register in `ServiceContainer.swift`
4. Inject via factory methods into relevant ViewModels
5. Add test double (`Mock` or `Fake`) in `VoxPresentation/Sources/TestDoubles/`

## Constraints

- VoxApplication must not import SwiftUI, AppKit, UIKit, or AVFoundation
- Use cases communicate via protocols only — never concrete types
- State machines in use cases use value-type enums (never mutate state directly)
- Always run: `swift build --package-path Packages/VoxApplication` after changes

"""
