# .local-review.yml — VoxPocket local review gates

auto_fix: true
provider: codex
model: gpt-5.4-codex
fail_on: critical

commit:
  commands:
    - "bash scripts/gates/gate-precommit.sh"
    - "zsh scripts/docs/lint_docs_map.sh"
    - "zsh scripts/docs/lint_docs_freshness.sh"
  reviewers:
    parallel: true
    fail_on: critical
    agents:
      - id: code-quality
        prompt: "Focus on Swift/SwiftUI code quality: poor naming, dead code, unnecessary complexity, missing error handling, code duplication, functions doing more than one thing. Flag serious violations as [HIGH] and minor improvements as [MEDIUM]."

      - id: performance
        prompt: "Focus on Swift/SwiftUI performance: Thread.sleep or any blocking call on the main thread (always [CRITICAL]), unnecessary allocations, excessive copying, redundant computation, synchronous I/O on the main thread, missing async/await where applicable. Flag regressions as [HIGH] and minor improvements as [MEDIUM]."

push:
  commands:
    - "bash scripts/gates/gate-prepush.sh"

merge_to_main:
  reviewers:
    parallel: true
    fail_on: critical
    agents:
      - id: security
        prompt: "Focus on security: hardcoded secrets or API keys (always [CRITICAL]), injection vulnerabilities, insecure data handling, improper authentication or authorization, sensitive data written to logs. Flag critical issues as [CRITICAL] and potential weaknesses as [HIGH]."

      - id: no-microsoft-info
        prompt: "Scan for any Microsoft-specific content: Azure endpoints or resource IDs, Microsoft tenant IDs, Microsoft account references, Office 365 or Teams fields, Windows Registry paths, Microsoft copyright notices, OneDrive or SharePoint references, or any other Microsoft product or service identifiers. Flag any such content as [CRITICAL]."
