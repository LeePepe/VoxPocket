name: auto-merge

# 非 draft PR 挂 auto-merge；真正何时合并由默认分支的 ruleset 机器门决定（所有
# required status check 全绿）。kimi-review 是 advisory-only；claude-review 已删除。
#
# 策略（每次 PR 打开/更新/改标签/切 draft 时重新评估）：
#   - draft 或带 `owner-review` 标签 → 不挂 auto-merge，已挂的撤掉（等 Owner 手动合并）。
#   - 带 `preserve-history` 标签 → merge commit（保留逐 commit 历史，VoxKit Q9）。
#   - 其余 → squash。
#
# 不论谁提的 PR 都触发（包括 fork）。本 workflow 只调 gh API、不 checkout 也不执行
# PR 代码，用内置 GITHUB_TOKEN，所以 fork 无 secret 也没关系，且无 RCE 面。

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Apply auto-merge policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          has_label() { printf '%s' "$LABELS" | jq -e --arg l "$1" 'index($l) != null' >/dev/null; }
          if [ "$DRAFT" = "true" ] || has_label owner-review; then
            echo "draft or owner-review: auto-merge stays off (Owner merges manually)"
            enabled="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$enabled" = "true" ]; then
              gh pr merge "$PR_URL" --disable-auto
            fi
            exit 0
          fi
          if has_label preserve-history; then method=--merge; else method=--squash; fi
          echo "enabling auto-merge with $method"
          gh pr merge "$PR_URL" "$method" --auto
