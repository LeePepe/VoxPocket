name: auto-merge

# 任何非 draft PR 一建就挂上 squash auto-merge。真正何时合并由默认分支的
# ruleset 机器门决定：所有 required status check 全绿 + 分支与 base 同步（strict）。
#
# 不论谁提的 PR 都触发（包括 fork）。本 workflow 只调 gh API、不执行 PR 代码，
# 用内置 GITHUB_TOKEN，所以 fork 无 secret 也没关系，且无 RCE 面。

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # draft PR 不挂 auto-merge；转 ready 时会再次触发。
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --auto
