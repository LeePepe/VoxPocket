name: codex-review-target

# Required AI review gate. Calls shared-ci's reusable codex review (fork guard,
# trusted base checkout, PR diff read as data). VoxPocket keeps its local Raven
# launcher (scripts/ci/review-raven.py, read from the trusted base tree).
# Check contexts: `codex-review-target / codex-review` (shared-ci template name; the
# required context since ruleset R3) and `codex-review-target` (legacy-context job,
# no longer required; kept so older references still resolve).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review-target:
    # shared-ci pin (same SHA as the AGENTS.md protocol pointer): c389366 is the Owner-approved
    # shared-ci v0.3.0 (tagged at c389366);
    # the pin change merges only with Owner code-owner review (see AGENTS.md Delivery).
    uses: LeePepe/shared-ci/.github/workflows/codex-review.yml@c389366a5c957c2442f5b7d5db40760acf3be43c
    with:
      rules-file: docs/repository-policy.md
      codex-launcher: python3 scripts/ci/review-raven.py
      codex-bin: /opt/homebrew/bin/codex
      # Human Owner account (never an App/bot): its unedited PR comments naming the
      # full current head SHA are trusted review input (shared-ci docs/review-rules.md).
      owner-user-id: "13819054"

  # Keeps the legacy check context `codex-review-target` (no longer required) green
  # only when the reusable review succeeded on this PR head; fails closed otherwise.
  legacy-context:
    name: codex-review-target
    needs: [codex-review-target]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.codex-review-target.result }}
        run: |
          echo "codex-review result: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::codex review did not pass ($RESULT)"; exit 1; }
