name: Code Review (Codex)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  code-review:
    uses: LeePepe/codex-pr-reviewer/.github/workflows/review.yml@v1
    with:
      file_pattern: '*.swift'
      topics: 'code-quality,performance,security'
      cli_path: '~/.superset/bin/codex'
