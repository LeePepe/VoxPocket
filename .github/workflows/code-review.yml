name: Code Review (Codex)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-code-quality:
    name: "Review: Code Quality"
    runs-on: [self-hosted, macOS, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Swift diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff ${{ github.event.pull_request.base.sha }}..HEAD -- '*.swift')
          else
            DIFF=$(git diff HEAD~1 -- '*.swift' 2>/dev/null || echo "")
          fi
          if [ -z "$DIFF" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            # Write diff to file to avoid arg length limits
            echo "$DIFF" > swift.diff
          fi

      - name: Run codex review
        if: steps.diff.outputs.empty == 'false'
        run: |
          DIFF=$(cat swift.diff)
          PROMPT="Review the following Swift code diff for code quality issues: naming conventions, code duplication, complexity, readability, SwiftUI best practices. Output a concise markdown report with findings grouped as CRITICAL, HIGH, MEDIUM, LOW. If no issues, say PASS.

$DIFF"
          ~/.superset/bin/codex -p "$PROMPT" --yolo 2>&1 | tee review-output.txt

      - name: No changes detected
        if: steps.diff.outputs.empty == 'true'
        run: echo "No Swift changes detected." > review-output.txt

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🔍 Code Review: Code Quality"
            echo ""
            cat review-output.txt
          } > comment-body.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment-body.txt --repo ${{ github.repository }}

