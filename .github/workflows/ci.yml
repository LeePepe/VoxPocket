name: CI

# Caller of the shared-ci fail-closed quality gate plus VoxPocket's own lanes.
#   - quality / aggregate: shared-ci reusable workflow (verify, contract audit,
#     workflow-lint, PR-body check). Not yet required; the ruleset change is an
#     Owner decision (see the PR that introduced this file).
#   - "SPM <pkg>", "App target", "Lint & policy": the existing required check
#     names in the ruleset. They now call the same entry as the local hook:
#     scripts/verify --layer <name> / --policy. Renaming them needs a ruleset change.
#   - "iOS simulator": iOS build/test lane, NOT required (plan Q13).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERIFY_MODE: ci

jobs:
  quality:
    uses: LeePepe/shared-ci/.github/workflows/quality.yml@761fe6b0b3ca5e2c57d244182d495ab8041851fa
    with:
      runs-on: macos-26
      setup-command: scripts/ci/fetch-external-deps.sh && brew install gitleaks
      verify-command: scripts/verify --all
      contract-audit: true
      workflow-lint: true

  # ---- REQUIRED: 5 SPM packages, one check per package ----
  spm:
    name: SPM ${{ matrix.package }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [VoxDomain, VoxInfrastructure, VoxApplication, VoxPresentation, VoxUITesting]
    steps:
      - name: Checkout VoxPocket
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repo
      - name: External packages at pinned SHAs (LokiKit from shared-telemetry)
        working-directory: repo
        run: scripts/ci/fetch-external-deps.sh
      - name: Select latest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
      - name: Layer gates (swift build + swift test)
        working-directory: repo
        run: scripts/verify --layer ${{ matrix.package }}

  # ---- REQUIRED: app target — xcodegen + xcodebuild (no signing) ----
  app:
    name: App target
    runs-on: macos-26
    steps:
      - name: Checkout VoxPocket
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repo
      - name: External packages at pinned SHAs
        working-directory: repo
        run: scripts/ci/fetch-external-deps.sh
      - name: Select latest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate xcodeproj from project.yml
        working-directory: repo/VoxPocket
        run: xcodegen generate --spec project.yml
      - name: Build app — macOS (no signing)
        working-directory: repo
        run: |
          set -o pipefail
          xcodebuild -project VoxPocket/VoxPocket.xcodeproj -scheme VoxPocket \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild-macos.log
      - name: App shell regressions (startup, menu bar, quick record, realtime, logging)
        working-directory: repo
        timeout-minutes: 15
        run: scripts/verify --layer VoxPocketApp
      # iOS generic build stays required: iOS compile debt used to hide until release.
      - name: Build app — iOS (no signing)
        working-directory: repo
        run: |
          set -o pipefail
          xcodebuild -project VoxPocket/VoxPocket.xcodeproj -scheme VoxPocket \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild-ios.log

  # ---- NOT REQUIRED: iOS simulator build + package tests (plan Q13) ----
  ios:
    name: iOS simulator
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Checkout VoxPocket
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repo
      - name: External packages at pinned SHAs
        working-directory: repo
        run: scripts/ci/fetch-external-deps.sh
      - name: Select latest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios
      - name: iOS simulator build and test
        working-directory: repo
        run: scripts/ci/ios-simulator.sh

  # ---- REQUIRED: lint + policy (same entry as the local hook) ----
  policy:
    name: Lint & policy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Repository policy (contract audit, workflow-lint, frontmatter, privacy, secrets)
        run: scripts/verify --policy
