name: testflight

# 自动构建 main 并在 CI 成功后发布至 macOS TestFlight；支持 workflow_dispatch 手动回退。
# iOS TestFlight 需 Owner 另行授权。
#
# 跑在 self-hosted runner（macmini-local，与 VitalStride 同一台物理机）：Apple
# Distribution 证书已在登录钥匙串。签名走 project.yml 的 manual + App Store profile。
# 需要的 Secrets: ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 / KEYCHAIN_PASSWORD。
#
# push tag 不触发 ci.yml（其 push 过滤是 branches:[main]），无副作用。

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: '忽略"无新提交"检查，强制发一次'
        type: boolean
        default: false
      platform:
        description: '当前仅发布 macOS；iOS TestFlight 需 Owner 另行授权'
        type: choice
        options:
          - macos
        default: macos

concurrency:
  group: testflight
  cancel-in-progress: false # 不打断进行中的上传

jobs:
  release:
    name: Build & upload to TestFlight
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.gate.outputs.latest }}
      should_release: ${{ steps.gate.outputs.release }}
    # Fork guard form required by shared-ci workflow-lint for self-hosted jobs.
    if: >-
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Record source CI authorization
        if: github.event_name == 'workflow_run'
        run: |
          echo "Source CI run ID: ${{ github.event.workflow_run.id }}"
          echo "Source CI run URL: ${{ github.event.workflow_run.html_url }}"

      - name: Checkout VoxPocket
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          path: repo

      - name: Verify candidate commit
        working-directory: repo
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out HEAD ($ACTUAL_SHA) does not match expected candidate SHA ($EXPECTED_SHA)"
            exit 1
          fi
          echo "Candidate SHA: $ACTUAL_SHA"

      # 外部本地依赖（fastlane build 需要）：AppleUITesting 落在
      # repo/VoxPocket 上两级 = $GITHUB_WORKSPACE 同级；LokiKit 由 SwiftPM 按 shared-telemetry commit 5f4b4d9（v0.1.0）固定解析。
      - name: Checkout AppleUITesting (external local dependency)
        uses: actions/checkout@v4
        with:
          repository: LeePepe/AppleUITesting
          ref: e6be2fcdf83341a9f3000a4cc489237655461a07
          path: AppleUITesting

      - name: Verify AppleUITesting pin
        working-directory: AppleUITesting
        run: |
          set -euo pipefail
          EXPECTED_PIN="e6be2fcdf83341a9f3000a4cc489237655461a07"
          ACTUAL_PIN="$(git rev-parse HEAD)"
          if [ "$ACTUAL_PIN" != "$EXPECTED_PIN" ]; then
            echo "::error::AppleUITesting HEAD ($ACTUAL_PIN) does not match pinned SHA ($EXPECTED_PIN)"
            exit 1
          fi
          echo "AppleUITesting verified at $ACTUAL_PIN"

      - name: Decide whether to release
        id: gate
        working-directory: repo
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'macos' }}
          FORCE_INPUT: ${{ inputs.force || github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_PLATFORM" != "macos" ]; then
            echo "::error::iOS TestFlight releases need separate Owner authorization; only macos is allowed."
            exit 1
          fi

          CANDIDATE="$(git rev-parse HEAD)"
          echo "latest=$CANDIDATE" >> "$GITHUB_OUTPUT"

          MARKER_REF="refs/tags/testflight/macos-last-released"
          if git show-ref --verify --quiet "$MARKER_REF"; then
            MARKER_SHA="$(git rev-parse -q --verify "$MARKER_REF")"
            if [ "$CANDIDATE" = "$MARKER_SHA" ]; then
              MARKER_STATUS="equal"
            elif git merge-base --is-ancestor "$MARKER_SHA" "$CANDIDATE" 2>/dev/null; then
              MARKER_STATUS="valid-ancestor"
            else
              MARKER_STATUS="invalid"
            fi
          else
            MARKER_SHA=""
            MARKER_STATUS="absent"
          fi

          echo "Candidate: $CANDIDATE"
          echo "Marker: ${MARKER_SHA:-none} (status: $MARKER_STATUS)"
          echo "Force: $FORCE_INPUT"

          if [ "$MARKER_STATUS" = "invalid" ]; then
            echo "::error::Marker $MARKER_SHA is not an ancestor of candidate $CANDIDATE or is invalid. Failing closed."
            exit 1
          fi

          CHANGED_PATHS_FILE="/tmp/tf_changed_paths_$$.txt"
          trap 'rm -f "$CHANGED_PATHS_FILE"' EXIT
          : > "$CHANGED_PATHS_FILE"

          EXTRA_ARGS=()
          if [ -n "$MARKER_SHA" ]; then
            EXTRA_ARGS+=(--marker-sha "$MARKER_SHA")
          fi

          if [ "$MARKER_STATUS" = "valid-ancestor" ]; then
            git diff --name-only "${MARKER_SHA}..${CANDIDATE}" > "$CHANGED_PATHS_FILE"
            EXTRA_ARGS+=(--paths-file "$CHANGED_PATHS_FILE")
          fi

          FORCE_ARG=()
          if [ "$FORCE_INPUT" = "true" ]; then
            FORCE_ARG=(--force)
          fi

          python3 scripts/ci/testflight_relevance.py \
            --candidate-sha "$CANDIDATE" \
            --marker-status "$MARKER_STATUS" \
            "${EXTRA_ARGS[@]}" \
            "${FORCE_ARG[@]}" \
            --github-output "$GITHUB_OUTPUT"

          DECISION_REASON="$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2 || true)"
          DECISION_RELEASE="$(grep '^release=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2 || true)"

          if [ "$DECISION_RELEASE" = "true" ]; then
            echo "→ Decision: RELEASE ($DECISION_REASON)"
          else
            echo "→ Decision: SKIP ($DECISION_REASON)"
            if [ "$DECISION_REASON" = "no-app-relevant-change" ]; then
              echo "no app-relevant changes since testflight/macos-last-released" >> "$GITHUB_STEP_SUMMARY" || true
            elif [ "$DECISION_REASON" = "already-released" ]; then
              echo "candidate $CANDIDATE already released" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

      - name: Verify Xcode
        if: steps.gate.outputs.release == 'true'
        run: |
          echo "Using: $(xcode-select -p)"
          xcodebuild -version

      - name: Ensure fastlane + xcodegen
        if: steps.gate.outputs.release == 'true'
        run: |
          brew list fastlane >/dev/null 2>&1 || brew install fastlane
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Test release packaging without building an App
        if: steps.gate.outputs.release == 'true'
        working-directory: repo
        run: |
          GEM_PATH="$(brew --prefix fastlane)/libexec" \
            "$(brew --prefix ruby)/bin/ruby" scripts/tests/test_testflight_packaging.rb

      - name: Verify API key secret present
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # fastlane 直接吃 base64 key_content，这里仅校验 Secret 存在，不落地明文 .p8。
          if [ -z "${ASC_KEY_P8_BASE64:-}" ]; then
            echo "::error::ASC_KEY_P8_BASE64 secret 未设置" ; exit 1
          fi

      - name: Unlock login keychain for codesign
        if: steps.gate.outputs.release == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # runner 跑在独立 launchd 会话，login keychain 默认锁定 → codesign 拿不到
          # Apple Distribution 私钥 → errSecInternalComponent。每次 build 前显式解锁。
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::KEYCHAIN_PASSWORD secret 未设置（gh secret set KEYCHAIN_PASSWORD -R LeePepe/VoxPocket）"; exit 1
          fi
          KC="$HOME/Library/Keychains/login.keychain-db"
          # 单独判解锁结果：密码错(错误码 51)时给出明确指引，区别于"secret 没设"。
          if ! security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC" 2>/tmp/kc-unlock.err; then
            echo "::error::解锁 login keychain 失败——KEYCHAIN_PASSWORD 的值不对（应为这台 runner Mac 的登录密码，注意别含尾随空格/换行）。重设：gh secret set KEYCHAIN_PASSWORD -R LeePepe/VoxPocket"
            cat /tmp/kc-unlock.err >&2 || true
            exit 1
          fi
          security set-keychain-settings "$KC"
          EXISTING=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s $(printf '%s\n' "$KC" $EXISTING | awk '!seen[$0]++')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null 2>&1 || true

      - name: fastlane iOS beta
        # 保留 iOS 发布实现；Owner 另行授权前手动/定时触发均不执行 iOS lane。
        if: ${{ false }}
        working-directory: repo
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: fastlane ios beta

      - name: fastlane macOS beta
        id: fastlane_mac
        if: steps.gate.outputs.release == 'true'
        working-directory: repo
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: fastlane mac beta

      - name: Cleanup keychain and temporary state
        if: always() && steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          KC="$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$KC" ]; then
            security lock-keychain "$KC" 2>/dev/null
          fi
          rm -f /tmp/kc-unlock.err

  advance_marker:
    name: Advance last-released marker
    needs: release
    if: needs.release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move last-released tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.release.outputs.candidate }}
        run: |
          set -euo pipefail
          git init marker-update
          cd marker-update
          git fetch --no-tags \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "FETCH_HEAD:refs/tags/testflight/macos-last-released"
