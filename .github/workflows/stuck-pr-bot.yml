name: stuck-PR bot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  report:
    # shared-ci v0.7.3; same full SHA as the AGENTS.md protocol pointer.
    uses: LeePepe/shared-ci/.github/workflows/stuck-pr-bot.yml@46c88fbae98b03dc6cf2e23c2e5a19c48ff68fe4
    with:
      failure-hours: 2
      open-hours: 24
