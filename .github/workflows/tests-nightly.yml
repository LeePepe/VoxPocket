name: tests-nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, macOS, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run nightly test executor
        run: zsh scripts/test-executor/run_nightly.sh

      - name: Print test report
        if: always()
        run: |
          if [ -f artifacts/reports/test-report.json ]; then
            cat artifacts/reports/test-report.json
          else
            echo "artifacts/reports/test-report.json not found"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-nightly-artifacts
          path: artifacts/
          if-no-files-found: warn
