name: kimi-review

# Advisory-only Kimi review via shared-ci's reusable workflow. Never required.
# pull_request_target evaluates trusted base YAML; the PR diff is read as data.
# The runner must have `kimi` on its PATH (otherwise the sticky comment says "unavailable").
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kimi-review:
    # shared-ci v0.8.0; same full SHA as the AGENTS.md protocol pointer.
    uses: LeePepe/shared-ci/.github/workflows/kimi-review.yml@fd8a187ef4872aa1aa69c4e9afec9782183cc02d
