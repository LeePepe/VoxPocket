name: kimi-review

# Advisory-only Kimi review. This check is intentionally absent from the main ruleset.
# pull_request_target evaluates trusted base YAML. The trusted base script embeds the
# PR diff as data and launches a tool-less Kimi agent.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kimi-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    steps:
      - name: Checkout base (trusted script source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run local Kimi advisory review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.repository }}
        run: scripts/ci/kimi-review.sh

  kimi-review-fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "Kimi advisory review is skipped for fork pull requests."
