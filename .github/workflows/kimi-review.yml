name: kimi-review

# Advisory-only Kimi review via shared-ci's reusable workflow. Never required.
# pull_request_target evaluates trusted base YAML; the PR diff is read as data.
# The runner must have `kimi` on its PATH (otherwise the sticky comment says "unavailable").
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kimi-review:
    # shared-ci pin (same SHA as the AGENTS.md protocol pointer): c389366 is the Owner-approved
    # shared-ci v0.3.0 (tagged at c389366);
    # the pin change merges only with Owner code-owner review (see AGENTS.md Delivery).
    uses: LeePepe/shared-ci/.github/workflows/kimi-review.yml@6e354f476bc53d68f0f09fc231d5cd938466af9c
