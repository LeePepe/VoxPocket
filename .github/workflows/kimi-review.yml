name: kimi-review

# Advisory-only Kimi review via shared-ci's reusable workflow. Never required.
# pull_request_target evaluates trusted base YAML; the PR diff is read as data.
# The runner must have `kimi` on its PATH (otherwise the sticky comment says "unavailable").
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kimi-review:
    # shared-ci pin (same SHA as the AGENTS.md protocol pointer): 5b42aa1 is the Owner-approved
    # shared-ci v0.2.0 (tagged at 5b42aa1);
    # the pin change merges only with Owner code-owner review (see AGENTS.md Delivery).
    uses: LeePepe/shared-ci/.github/workflows/kimi-review.yml@5b42aa164692911799e927500b5684954f2e075f
