name: Actions Monitor

on:
  workflow_run:
    workflows:
      - "docs-governance"
      - "tests-pr"
      - "UI Feedback Review"
      - "Code Review (Codex)"
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  issues: write
  actions: read
  checks: read

jobs:
  handle-failure:
    name: Handle Workflow Failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Resolve PR for this run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"

          # Find associated PR
          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          echo "run_id=$RUN_ID"         >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA"     >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"         >> "$GITHUB_OUTPUT"
          echo "workflow=$WORKFLOW"     >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER"   >> "$GITHUB_OUTPUT"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch failure logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.pr.outputs.run_id }}"
          mkdir -p /tmp/vox_action_logs

          # Download logs for failed jobs
          gh run view "$RUN_ID" --log-failed > /tmp/vox_action_logs/failed.log 2>&1 || true
          # Truncate to 15KB to stay within prompt limits
          head -c 15000 /tmp/vox_action_logs/failed.log > /tmp/vox_action_logs/failed_truncated.log

      - name: Run orchestrator to fix failure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          FAILED_WORKFLOW: ${{ steps.pr.outputs.workflow }}
          RUN_ID: ${{ steps.pr.outputs.run_id }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          {
            echo "A GitHub Actions workflow failed. Analyze the failure and fix it."
            echo ""
            echo "== Failed Workflow =="
            echo "Name: $FAILED_WORKFLOW"
            echo "Run ID: $RUN_ID"
            echo "Branch: $BRANCH"
            echo "Head SHA: $HEAD_SHA"
            echo "PR: ${PR_NUMBER:-none}"
            echo ""
            echo "== Failure Logs (truncated at 15KB) =="
            cat /tmp/vox_action_logs/failed_truncated.log
            echo ""
            echo "== Task =="
            echo "1. Identify the root cause from the logs."
            echo "2. Determine which file(s) need changing."
            echo "3. Apply the minimal fix."
            echo "4. Run 'swift build' if Swift files were changed."
            echo "5. Commit with: fix(ci): <description>"
            echo "6. If PR_NUMBER is set, post a comment summarizing the fix."
          } > /tmp/vox_fix_prompt.txt

          claude \
            --system-prompt "$PWD/.claude/agents/orchestrator.md" \
            --dangerously-skip-permissions \
            --print \
            "$(cat /tmp/vox_fix_prompt.txt)" \
            > /tmp/vox_fix_output.txt 2>&1

          # Post summary to PR if available
          if [ -n "$PR_NUMBER" ] && [ -s /tmp/vox_fix_output.txt ]; then
            REPO="${{ github.repository }}"
            {
              echo "## Actions Monitor — Auto-fix Attempt"
              echo ""
              echo "**Failed workflow:** ${FAILED_WORKFLOW} (run [${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}))"
              echo ""
              cat /tmp/vox_fix_output.txt
            } > /tmp/vox_comment_body.txt
            gh pr comment "$PR_NUMBER" --body-file /tmp/vox_comment_body.txt
          fi

  auto-merge:
    name: Auto-merge if all clear
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Resolve PR for this run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA"   >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"       >> "$GITHUB_OUTPUT"

      - name: Check all CI checks pass
        id: checks
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"

          # Wait a moment for all concurrent workflow_run events to settle
          sleep 10

          # Check all checks on this PR's head SHA — must all be SUCCESS or SKIPPED
          ALL_PASS=$(gh pr checks "$PR" --json name,state \
            --jq 'all(.state == "SUCCESS" or .state == "SKIPPED")' 2>/dev/null || echo "false")

          echo "all_pass=$ALL_PASS" >> "$GITHUB_OUTPUT"

      - name: Check PR has no blocking comments or review requests
        id: clean
        if: steps.pr.outputs.pr_number != '' && steps.checks.outputs.all_pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"

          # Check for CHANGES_REQUESTED reviews
          REVIEW_DECISION=$(gh pr view "$PR" \
            --json reviewDecision \
            --jq '.reviewDecision // "NONE"')

          # Check for unresolved review threads (inline comments)
          UNRESOLVED=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  reviewThreads(first:50) {
                    nodes { isResolved }
                  }
                }
              }
            }' \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            -F pr="$PR" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' \
            2>/dev/null || echo "0")

          # Check for human (non-bot) PR comments
          HUMAN_COMMENTS=$(gh pr view "$PR" \
            --json comments \
            --jq '[.comments[] | select(.author.login != "github-actions[bot]" and .author.login != "github-advanced-security[bot]")] | length' \
            2>/dev/null || echo "0")

          echo "review_decision=$REVIEW_DECISION"   >> "$GITHUB_OUTPUT"
          echo "unresolved_threads=$UNRESOLVED"     >> "$GITHUB_OUTPUT"
          echo "human_comments=$HUMAN_COMMENTS"     >> "$GITHUB_OUTPUT"

          # Determine if clean
          if [ "$REVIEW_DECISION" = "CHANGES_REQUESTED" ]; then
            echo "is_clean=false" >> "$GITHUB_OUTPUT"
          elif [ "$UNRESOLVED" != "0" ]; then
            echo "is_clean=false" >> "$GITHUB_OUTPUT"
          elif [ "$HUMAN_COMMENTS" != "0" ]; then
            echo "is_clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_clean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge PR
        if: |
          steps.pr.outputs.pr_number != '' &&
          steps.checks.outputs.all_pass == 'true' &&
          steps.clean.outputs.is_clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          gh pr merge "$PR" --squash --delete-branch \
            --subject "$(gh pr view "$PR" --json title --jq '.title')"
          echo "PR #$PR merged successfully."

      - name: Update local main after merge
        if: |
          steps.pr.outputs.pr_number != '' &&
          steps.checks.outputs.all_pass == 'true' &&
          steps.clean.outputs.is_clean == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "Local main updated to $(git rev-parse --short HEAD)."

      - name: Post skip reason if not merging
        if: |
          steps.pr.outputs.pr_number != '' &&
          steps.checks.outputs.all_pass == 'true' &&
          steps.clean.outputs.is_clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          DECISION="${{ steps.clean.outputs.review_decision }}"
          UNRESOLVED="${{ steps.clean.outputs.unresolved_threads }}"
          COMMENTS="${{ steps.clean.outputs.human_comments }}"
          {
            echo "## Actions Monitor — Auto-merge Skipped"
            echo ""
            echo "All CI checks passed, but PR is not clean:"
            [ "$DECISION" = "CHANGES_REQUESTED" ] && echo "- Review decision: CHANGES_REQUESTED"
            [ "$UNRESOLVED" != "0" ] && echo "- Unresolved review threads: $UNRESOLVED"
            [ "$COMMENTS" != "0" ] && echo "- Human comments requiring attention: $COMMENTS"
          } > /tmp/vox_skip_body.txt
          gh pr comment "$PR" --body-file /tmp/vox_skip_body.txt
